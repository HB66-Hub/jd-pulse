<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东脉搏 — JD.com News Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
    <style>
        /* ====== CSS Variables & Reset ====== */
        :root {
            --jd-red: #E2231A;
            --jd-red-light: #FF6B6B;
            --jd-dark: #1a1a2e;
            --jd-card-bg: #ffffff;
            --jd-card-glass: rgba(255,255,255,0.85);
            --jd-text: #2d3436;
            --jd-text-secondary: #636e72;
            --jd-accent: #fdcb6e;
            --jd-blue: #0984e3;
            --jd-green: #00b894;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --jd-card-bg: #1e1e30;
            --jd-card-glass: rgba(30,30,48,0.85);
            --jd-text: #e0e0e0;
            --jd-text-secondary: #a0a0b0;
            --jd-dark: #f0f0f0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 50%, #f0f2f5 100%);
            color: var(--jd-text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
        }

        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a2e 50%, #16213e 100%);
        }

        /* ====== Animated Background Elements ====== */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }
        .bg-orb-1 { width: 600px; height: 600px; background: var(--jd-red); top: -200px; right: -150px; animation-delay: 0s; }
        .bg-orb-2 { width: 400px; height: 400px; background: var(--jd-blue); bottom: -100px; left: -100px; animation-delay: -7s; }
        .bg-orb-3 { width: 300px; height: 300px; background: var(--jd-accent); top: 50%; left: 50%; animation-delay: -14s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, -50px) scale(0.95); }
            75% { transform: translate(-40px, 20px) scale(1.02); }
        }

        /* ====== Header / Hero ====== */
        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero-logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .hero-logo-icon {
            width: 56px; height: 56px;
            background: var(--jd-red);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(226,35,26,0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(226,35,26,0.3); }
            50% { box-shadow: 0 8px 40px rgba(226,35,26,0.5); }
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--jd-red) 0%, #ff4757 50%, var(--jd-red-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .hero .subtitle {
            color: var(--jd-text-secondary);
            font-size: 1.1rem;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .hero .update-time {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 8px 20px;
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--jd-text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .update-dot {
            width: 8px; height: 8px;
            background: var(--jd-green);
            border-radius: 50%;
            animation: ping 1.5s ease-in-out infinite;
        }

        @keyframes ping {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        /* ====== Toolbar ====== */
        .toolbar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 20px 30px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 10px 22px;
            border: 1.5px solid rgba(0,0,0,0.08);
            border-radius: 50px;
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            color: var(--jd-text);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-btn:hover, .toolbar-btn.active {
            background: var(--jd-red);
            color: #fff;
            border-color: var(--jd-red);
            box-shadow: 0 6px 20px rgba(226,35,26,0.3);
            transform: translateY(-2px);
        }

        #theme-toggle {
            width: 42px; height: 42px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        /* ====== Ticker ====== */
        .ticker-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }

        .ticker {
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .ticker-label {
            background: var(--jd-red);
            color: #fff;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ticker-track {
            overflow: hidden;
            flex: 1;
            position: relative;
        }

        .ticker-items {
            display: flex;
            gap: 40px;
            animation: ticker-scroll 30s linear infinite;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-item {
            white-space: nowrap;
            color: var(--jd-text-secondary);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .ticker-item .up { color: var(--jd-green); font-weight: 700; }
        .ticker-item .down { color: var(--jd-red); font-weight: 700; }

        /* ====== Main Grid ====== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
        }

        .section-icon.news { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
        .section-icon.events { background: linear-gradient(135deg, #dfe6e9, #b2bec3); }
        .section-icon.stats { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--jd-text);
        }

        .section-header .section-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 50px;
            background: var(--jd-card-glass);
            color: var(--jd-text-secondary);
        }

        /* ====== News Cards ====== */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .news-card {
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            padding: 28px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--jd-red), var(--jd-red-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--transition);
        }

        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .news-card:hover::before { transform: scaleX(1); }

        .news-card .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .news-card .card-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
        }

        .tag-business { background: #e8f5e9; color: #2e7d32; }
        .tag-tech { background: #e3f2fd; color: #1565c0; }
        .tag-logistics { background: #fff3e0; color: #e65100; }
        .tag-finance { background: #fce4ec; color: #c62828; }
        .tag-market { background: #f3e5f5; color: #6a1b9a; }

        .news-card .card-date {
            font-size: 0.8rem;
            color: var(--jd-text-secondary);
        }

        .news-card .card-source {
            font-size: 0.75rem;
            color: var(--jd-red);
            font-weight: 600;
            background: rgba(226,35,26,0.06);
            padding: 2px 10px;
            border-radius: 50px;
        }

        .news-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.5;
            color: var(--jd-text);
        }

        .news-card p {
            font-size: 0.9rem;
            color: var(--jd-text-secondary);
            line-height: 1.7;
        }

        .news-card .card-arrow {
            position: absolute;
            bottom: 20px; right: 24px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(226,35,26,0.1);
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transform: translateX(-10px);
            transition: all var(--transition);
            color: var(--jd-red);
        }

        .news-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

        /* Feature Card - wide */
        .news-card.featured {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
            padding: 36px;
        }

        .featured-visual {
            background: linear-gradient(135deg, rgba(226,35,26,0.08), rgba(9,132,227,0.08));
            border-radius: var(--radius-sm);
            padding: 30px;
            text-align: center;
            font-size: 3rem;
        }

        .featured-content h3 { font-size: 1.4rem; }
        .featured-content p { font-size: 1rem; }

        /* ====== Timeline ====== */
        .timeline-section {
            margin-bottom: 40px;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 12px; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--jd-red), var(--jd-blue), var(--jd-green));
        }

        .timeline-item {
            position: relative;
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }

        .timeline-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px; top: 28px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--jd-red);
            border: 3px solid #fff;
            box-shadow: 0 0 0 4px rgba(226,35,26,0.15);
        }

        .tl-date {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--jd-red);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .tl-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--jd-text);
            margin-bottom: 6px;
        }

        .tl-desc {
            font-size: 0.85rem;
            color: var(--jd-text-secondary);
            line-height: 1.6;
        }

        /* ====== Stats Cards ====== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--jd-card-glass);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-sm);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--jd-red), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--jd-text-secondary);
            margin-top: 6px;
        }

        .stat-change {
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .stat-change.positive { color: var(--jd-green); }
        .stat-change.negative { color: var(--jd-red); }

        /* ====== Footer ====== */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--jd-text-secondary);
            font-size: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .footer a { color: var(--jd-red); text-decoration: none; }

        /* ====== Responsive ====== */
        @media (max-width: 768px) {
            .hero { padding: 40px 16px 24px; }
            .hero h1 { font-size: 28px; }
            .news-grid { grid-template-columns: 1fr; }
            .news-card.featured { grid-template-columns: 1fr; }
            .featured-visual { display: none; }
            .timeline { padding-left: 24px; }
            .timeline-item::before { left: -18px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .toolbar { gap: 8px; }
            .toolbar-btn { padding: 8px 16px; font-size: 0.8rem; }
        }

        /* ====== Loading Skeleton ====== */
        .skeleton {
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ====== Scroll Reveal ====== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--jd-text-secondary);
        }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- ====== Hero ====== -->
    <header class="hero reveal">
        <div class="hero-logo">
            <div class="hero-logo-icon">🐕</div>
        </div>
        <h1>京东脉搏</h1>
        <p class="subtitle">JD.COM · NEWS &amp; INSIGHTS</p>
        <div class="update-time">
            <span class="update-dot"></span>
            最近更新：<span id="last-update">2026年7月30日</span>
        </div>
    </header>

    <!-- ====== Toolbar ====== -->
    <div class="toolbar reveal">
        <button class="toolbar-btn active" data-filter="all">📋 全部</button>
        <button class="toolbar-btn" data-filter="business">💼 业务</button>
        <button class="toolbar-btn" data-filter="tech">🔬 技术</button>
        <button class="toolbar-btn" data-filter="logistics">📦 物流</button>
        <button class="toolbar-btn" data-filter="finance">💰 财报</button>
        <button id="theme-toggle" class="toolbar-btn" title="切换主题">🌓</button>
    </div>

    <!-- ====== Ticker ====== -->
    <div class="ticker-wrap reveal">
        <div class="ticker">
            <span class="ticker-label">实时快讯</span>
            <div class="ticker-track">
                <div class="ticker-items" id="ticker-items"></div>
            </div>
        </div>
    </div>

    <main class="container">

        <!-- ====== Stats Row (populated from data.js) ====== -->
        <div class="stats-row reveal" id="stats-row"></div>

        <!-- ====== Featured News ====== -->
        <div class="section-header reveal">
            <div class="section-icon news">📰</div>
            <h2>头条新闻</h2>
            <span class="section-badge" id="news-count">5篇</span>
        </div>

        <div class="news-grid" id="news-grid">
            <!-- Populated by JS -->
        </div>

        <!-- ====== Major Events Timeline ====== -->
        <div class="timeline-section reveal">
            <div class="section-header">
                <div class="section-icon events">📅</div>
                <h2>大事件</h2>
                <span class="section-badge">2026</span>
            </div>
            <div class="timeline" id="timeline">
                <!-- Populated by JS -->
            </div>
        </div>

    </main>

    <footer class="footer">
        <div class="sources-bar" id="sources-bar"></div>
        <p style="margin-top:16px">京东脉搏 · <span id="current-year">2026</span> · 数据来源公开信息，仅供参考</p>
        <p style="margin-top:4px;font-size:0.75rem">Made with ❤️ &nbsp;|&nbsp; <a href="https://corporate.jd.com" target="_blank">JD.com Corporate</a></p>
    </footer>

    <script src="data.js"></script>
    <script>
        // ====== Data Layer ======
        // Data loaded from data.js (updated daily at 9:00 AM by cron)
        // Sources: 财联社 / 东方财富 / 同花顺 / Wind金融终端 / 36氪 / 京东官方

        // ====== Render Functions ======
        function renderStats() {
            if (typeof STATS_DATA === 'undefined') return;
            document.getElementById('stats-row').innerHTML = STATS_DATA.map(s => `
                <div class="stat-card">
                    <div class="stat-value">${s.value}</div>
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-change ${s.positive ? 'positive' : 'negative'}">${s.change}</div>
                </div>
            `).join('');
        }

        function renderTicker() {
            if (typeof TICKER_ITEMS === 'undefined') return;
            const items = TICKER_ITEMS.map(t => `<span class="ticker-item">${t}</span>`).join('');
            document.getElementById('ticker-items').innerHTML = items + items; // duplicate for seamless loop
        }

        function renderSources() {
            if (typeof DATA_SOURCES === 'undefined') return;
            document.getElementById('sources-bar').innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;border-top:1px solid rgba(0,0,0,0.06);margin-bottom:0;">
                    <span style="font-size:0.8rem;color:var(--jd-text-secondary);font-weight:600;">数据来源</span>
                    ${DATA_SOURCES.map(s => `
                        <a href="${s.url}" target="_blank" rel="noopener" style="text-decoration:none;font-size:0.8rem;color:var(--jd-text-secondary);display:inline-flex;align-items:center;gap:4px;transition:color 0.2s;" onmouseover="this.style.color='var(--jd-red)'" onmouseout="this.style.color='var(--jd-text-secondary)'">
                            <span>${s.logo}</span><span>${s.name}</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function renderNews(filter = 'all') {
            if (typeof NEWS_DATA === 'undefined') return;
            const grid = document.getElementById('news-grid');
            const filtered = filter === 'all' ? NEWS_DATA : NEWS_DATA.filter(n => n.tag === filter);
            document.getElementById('news-count').textContent = filtered.length + '篇';

            grid.innerHTML = filtered.map((n, idx) => {
                const isFirst = idx === 0 && filter === 'all';
                if (isFirst) {
                    return `
                    <div class="news-card featured">
                        <div class="featured-visual">${n.source || '🔥'}</div>
                        <div class="featured-content">
                            <div class="card-meta">
                                <span class="card-tag ${n.tagClass}">${n.tagLabel}</span>
                                ${n.source ? `<span class="card-source">📌 ${n.source}</span>` : ''}
                                <span class="card-date">${n.date}</span>
                            </div>
                            <h3>${n.title}</h3>
                            <p>${n.summary}</p>
                        </div>
                        <div class="card-arrow">→</div>
                    </div>`;
                }
                return `
                <div class="news-card">
                    <div class="card-meta">
                        <span class="card-tag ${n.tagClass}">${n.tagLabel}</span>
                        ${n.source ? `<span class="card-source">📌 ${n.source}</span>` : ''}
                        <span class="card-date">${n.date}</span>
                    </div>
                    <h3>${n.title}</h3>
                    <p>${n.summary}</p>
                    <div class="card-arrow">→</div>
                </div>`;
            }).join('');
        }

        function renderTimeline() {
            if (typeof TIMELINE_DATA === 'undefined') return;
            document.getElementById('timeline').innerHTML = TIMELINE_DATA.map(t => `
                <div class="timeline-item">
                    <div class="tl-date">${t.date}${t.source ? ' · ' + t.source : ''}</div>
                    <div class="tl-title">${t.title}</div>
                    <div class="tl-desc">${t.desc}</div>
                </div>
            `).join('');
        }

        // ====== Initial Render ======
        renderStats();
        renderTicker();
        renderSources();
        renderNews();
        renderTimeline();

        // ====== Filter ======
        document.querySelectorAll('.toolbar-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.toolbar-btn[data-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderNews(this.dataset.filter);
            });
        });

        // ====== Theme Toggle ======
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('jd-news-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌓';

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌓';
            localStorage.setItem('jd-news-theme', next);
        });

        // ====== Scroll Reveal ======
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // ====== Clock ======
        document.getElementById('current-year').textContent = new Date().getFullYear();
        document.getElementById('last-update').textContent = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
    </script>
</body>
</html>
